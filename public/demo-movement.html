<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>SkyControl — Movement Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #e5e7eb; }
  h1 { font-size: 14px; letter-spacing: 4px; color: #facc15; text-transform: uppercase; margin-bottom: 8px; }
  p  { font-size: 11px; color: #6b7280; margin-bottom: 16px; letter-spacing: 1px; }
  canvas { border: 1px solid #1f2937; border-radius: 6px; display: block; }
  .controls { margin-top: 12px; display: flex; gap: 10px; }
  button {
    padding: 6px 16px; font-size: 11px; font-family: 'Courier New', monospace;
    letter-spacing: 2px; text-transform: uppercase; border: none; border-radius: 4px;
    cursor: pointer; font-weight: bold;
  }
  .btn-spawn  { background: #1d4ed8; color: #fff; }
  .btn-spawn:hover { background: #2563eb; }
  .btn-clear  { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
  .btn-clear:hover { background: #374151; }
  .legend { margin-top: 10px; display: flex; gap: 20px; font-size: 10px; color: #6b7280; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 3px; border-radius: 2px; }
</style>
</head>
<body>
<h1>SkyControl · Ground Movement Demo</h1>
<p>AirNav Radar-style · smooth taxiway following · trail + path ahead</p>
<canvas id="c" width="860" height="520"></canvas>
<div class="controls">
  <button class="btn-spawn" onclick="spawnRandom()">+ Spawn Aircraft</button>
  <button class="btn-clear" onclick="clearAll()">Clear All</button>
</div>
<div class="legend">
  <span><div class="dot" style="background:#ef4444"></div> Trail (past)</span>
  <span><div class="dot" style="background:#22c55e"></div> Route ahead</span>
  <span><div class="dot" style="background:#facc15"></div> Aircraft icon</span>
  <span><div class="dot" style="background:#60a5fa; height:8px; width:8px; border-radius:50%"></div> Waypoint node</span>
</div>

<script>
// ─────────────────────────────────────────────────────────────────
//  TAXIWAY GRAPH  (pixel coords on the 860×520 canvas)
//  Designed to look like a real airport layout
// ─────────────────────────────────────────────────────────────────

const W = 860, H = 520;

// Node map: id → {x, y, label?}
const NODES = {
  // ── Runway 25L centerline (horizontal, top) ──
  r25l_t1: { x: 80,  y: 90 },
  r25l_t2: { x: 780, y: 90 },

  // ── Runway 25R centerline (horizontal, bottom) ──
  r25r_b1: { x: 80,  y: 430 },
  r25r_b2: { x: 780, y: 430 },

  // ── Taxiway A (parallel to 25L, just below) ──
  a1:  { x: 80,  y: 140, label:'A' },
  a2:  { x: 200, y: 140 },
  a3:  { x: 340, y: 140 },
  a4:  { x: 480, y: 140 },
  a5:  { x: 620, y: 140 },
  a6:  { x: 760, y: 140 },

  // ── Taxiway B (parallel to 25R, just above) ──
  b1:  { x: 80,  y: 380, label:'B' },
  b2:  { x: 200, y: 380 },
  b3:  { x: 340, y: 380 },
  b4:  { x: 480, y: 380 },
  b5:  { x: 620, y: 380 },
  b6:  { x: 760, y: 380 },

  // ── Taxiway C (middle horizontal) ──
  c1:  { x: 80,  y: 260, label:'C' },
  c2:  { x: 200, y: 260 },
  c3:  { x: 340, y: 260 },
  c4:  { x: 480, y: 260 },
  c5:  { x: 620, y: 260 },
  c6:  { x: 760, y: 260 },

  // ── Cross-taxiways (vertical connectors) ──
  x1t: { x: 200, y: 90  },  x1a: { x: 200, y: 140 },  // reuse a2/b2 etc
  x2t: { x: 340, y: 90  },
  x3t: { x: 480, y: 90  },
  x4t: { x: 620, y: 90  },
  x5t: { x: 760, y: 90  },

  x1b: { x: 200, y: 430 },
  x2b: { x: 340, y: 430 },
  x3b: { x: 480, y: 430 },
  x4b: { x: 620, y: 430 },
  x5b: { x: 760, y: 430 },

  // ── Gates (terminal area, center) ──
  g1:  { x: 260, y: 200, label:'G1' },
  g2:  { x: 340, y: 200, label:'G2' },
  g3:  { x: 420, y: 200, label:'G3' },
  g4:  { x: 500, y: 200, label:'G4' },
  g5:  { x: 580, y: 200, label:'G5' },

  g6:  { x: 260, y: 320, label:'G6' },
  g7:  { x: 340, y: 320, label:'G7' },
  g8:  { x: 420, y: 320, label:'G8' },
  g9:  { x: 500, y: 320, label:'G9' },
  g10: { x: 580, y: 320, label:'G10' },

  // ── Gate apron connectors (vertical stubs) ──
  ga1: { x: 260, y: 140 }, ga2: { x: 340, y: 140 },
  ga3: { x: 420, y: 140 }, ga4: { x: 500, y: 140 },
  ga5: { x: 580, y: 140 },

  gb1: { x: 260, y: 380 }, gb2: { x: 340, y: 380 },
  gb3: { x: 420, y: 380 }, gb4: { x: 500, y: 380 },
  gb5: { x: 580, y: 380 },
};

// Deduplicate — a2=ga1? Not quite. Let's keep them separate for clarity.
// Adjacency list  [from, to, bidirectional]
const EDGES = [
  // Runway 25L
  ['r25l_t1','x1t'], ['x1t','x2t'], ['x2t','x3t'], ['x3t','x4t'], ['x4t','x5t'], ['x5t','r25l_t2'],
  // Runway 25R
  ['r25r_b1','x1b'], ['x1b','x2b'], ['x2b','x3b'], ['x3b','x4b'], ['x4b','x5b'], ['x5b','r25r_b2'],
  // Taxiway A
  ['a1','a2'],['a2','a3'],['a3','a4'],['a4','a5'],['a5','a6'],
  // Taxiway B
  ['b1','b2'],['b2','b3'],['b3','b4'],['b4','b5'],['b5','b6'],
  // Taxiway C
  ['c1','c2'],['c2','c3'],['c3','c4'],['c4','c5'],['c5','c6'],
  // Cross connectors (runway → A)
  ['x1t','a2'],['x2t','a3'],['x3t','a4'],['x4t','a5'],['x5t','a6'],
  // Cross connectors (runway → B)
  ['x1b','b2'],['x2b','b3'],['x3b','b4'],['x4b','b5'],['x5b','b6'],
  // A ↔ C ↔ B verticals
  ['a2','c2'],['c2','b2'],
  ['a3','c3'],['c3','b3'],  // also used by gate aprons
  ['a4','c4'],['c4','b4'],
  ['a5','c5'],['c5','b5'],
  ['a6','c6'],['c6','b6'],
  ['a1','c1'],['c1','b1'],
  // Gate apron stubs (A → gate upper row)
  ['a2','g1'],['a3','g2'],['a4','g3'],['a5','g4'],['a5','g5'],
  ['g1','c2'],['g2','c3'],['g3','c4'],['g4','c5'],['g5','c5'],
  // Gate apron stubs (B → gate lower row)
  ['b2','g6'],['b3','g7'],['b4','g8'],['b5','g9'],['b5','g10'],
  ['g6','c2'],['g7','c3'],['g8','c4'],['g9','c5'],['g10','c5'],
];

// Build adjacency for pathfinding
const adj = {};
for (const id of Object.keys(NODES)) adj[id] = [];
for (const [a, b] of EDGES) {
  if (!adj[a] || !adj[b]) continue;
  if (!adj[a].includes(b)) adj[a].push(b);
  if (!adj[b].includes(a)) adj[b].push(a);
}

// ── A* pathfinder ──
function dist(a, b) {
  const na = NODES[a], nb = NODES[b];
  return Math.hypot(na.x - nb.x, na.y - nb.y);
}

function astar(start, end) {
  if (start === end) return [start];
  const open = new Set([start]);
  const came = {};
  const g = { [start]: 0 };
  const f = { [start]: dist(start, end) };

  while (open.size) {
    let cur = null;
    for (const n of open) if (cur === null || (f[n]||Infinity) < (f[cur]||Infinity)) cur = n;
    if (cur === end) {
      const path = [];
      let c = cur;
      while (c) { path.unshift(c); c = came[c]; }
      return path;
    }
    open.delete(cur);
    for (const nb of (adj[cur] || [])) {
      const tg = (g[cur] || 0) + dist(cur, nb);
      if (tg < (g[nb] ?? Infinity)) {
        came[nb] = cur;
        g[nb] = tg;
        f[nb] = tg + dist(nb, end);
        open.add(nb);
      }
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────
//  AIRCRAFT
// ─────────────────────────────────────────────────────────────────

const GATE_NODES = ['g1','g2','g3','g4','g5','g6','g7','g8','g9','g10'];
const RUNWAY_ENDS = ['r25l_t1','r25l_t2','r25r_b1','r25r_b2'];

const CALLSIGNS = ['AAL123','UAL456','DAL789','BAW321','SWA654','JBU987','QTR111','UAE555'];
const COLORS    = ['#facc15','#fb923c','#a78bfa','#34d399','#60a5fa','#f472b6','#fde68a','#86efac'];

let aircrafts = [];
let idCounter = 0;

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function spawnRandom() {
  if (aircrafts.length >= 8) return;
  // departure: gate → runway end
  const fromNode = pickRandom(GATE_NODES);
  const toNode   = pickRandom(RUNWAY_ENDS);
  const path = astar(fromNode, toNode);
  if (!path || path.length < 2) return;

  const cs = CALLSIGNS[idCounter % CALLSIGNS.length];
  const color = COLORS[idCounter % COLORS.length];
  idCounter++;

  const startPt = NODES[path[0]];
  aircrafts.push({
    id: idCounter,
    callsign: cs,
    color,
    path,          // array of node ids
    seg: 0,        // current segment index (from path[seg] → path[seg+1])
    t: 0,          // 0..1 progress within current segment
    speed: 0.6 + Math.random() * 0.4, // px/frame
    x: startPt.x,
    y: startPt.y,
    heading: 0,
    trail: [{x: startPt.x, y: startPt.y}],
    done: false,
  });
}

function clearAll() { aircrafts = []; }

// ─────────────────────────────────────────────────────────────────
//  UPDATE
// ─────────────────────────────────────────────────────────────────

function updateAircraft(ac) {
  if (ac.done) return;
  if (ac.seg >= ac.path.length - 1) { ac.done = true; return; }

  const fromId = ac.path[ac.seg];
  const toId   = ac.path[ac.seg + 1];
  const from   = NODES[fromId];
  const to     = NODES[toId];
  const segLen = Math.hypot(to.x - from.x, to.y - from.y);

  // Advance t by speed/segLen
  ac.t += ac.speed / segLen;

  if (ac.t >= 1) {
    // Arrived at next node
    ac.t = 0;
    ac.seg++;
    if (ac.seg >= ac.path.length - 1) { ac.done = true; return; }
  }

  const f2 = NODES[ac.path[ac.seg]];
  const t2 = NODES[ac.path[ac.seg + 1]];
  ac.x = f2.x + (t2.x - f2.x) * ac.t;
  ac.y = f2.y + (t2.y - f2.y) * ac.t;
  ac.heading = Math.atan2(t2.y - f2.y, t2.x - f2.x) * 180 / Math.PI;

  // Trail — only append every ~4px
  const last = ac.trail[ac.trail.length - 1];
  if (Math.hypot(ac.x - last.x, ac.y - last.y) > 4) {
    ac.trail.push({x: ac.x, y: ac.y});
    if (ac.trail.length > 80) ac.trail.shift();
  }
}

// ─────────────────────────────────────────────────────────────────
//  DRAW
// ─────────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function drawMap() {
  // Background
  ctx.fillStyle = '#0d1321';
  ctx.fillRect(0, 0, W, H);

  // Terminal building
  ctx.fillStyle = '#1a2035';
  ctx.strokeStyle = '#2d3a52';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(230, 172, 380, 176, 6);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#243047';
  ctx.font = 'bold 11px Courier New';
  ctx.fillStyle = '#4b6080';
  ctx.textAlign = 'center';
  ctx.fillText('TERMINAL A', 420, 262);

  // Runway fills
  function drawRunway(x1, y1, x2, y2, w) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const nx = -dy/len * w/2, ny = dx/len * w/2;
    ctx.beginPath();
    ctx.moveTo(x1+nx, y1+ny); ctx.lineTo(x2+nx, y2+ny);
    ctx.lineTo(x2-nx, y2-ny); ctx.lineTo(x1-nx, y1-ny);
    ctx.closePath();
    ctx.fillStyle = '#1c2230';
    ctx.fill();
    ctx.strokeStyle = '#2a3245';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  drawRunway(80, 90, 780, 90, 22);
  drawRunway(80, 430, 780, 430, 22);

  // Runway centerlines (dashed white)
  ctx.setLineDash([12, 8]);
  ctx.strokeStyle = 'rgba(200,210,230,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(80,90);  ctx.lineTo(780,90);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(80,430); ctx.lineTo(780,430); ctx.stroke();
  ctx.setLineDash([]);

  // Runway labels
  ctx.fillStyle = 'rgba(200,210,230,0.5)';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('25L', 90, 82);
  ctx.fillText('07R', 750, 82);
  ctx.fillText('25R', 90, 446);
  ctx.fillText('07L', 750, 446);

  // Taxiway fills (dark grey pavement)
  function drawTaxiwaySegment(id1, id2, w) {
    const a = NODES[id1], b = NODES[id2];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) return;
    const nx = -dy/len * w/2, ny = dx/len * w/2;
    ctx.beginPath();
    ctx.moveTo(a.x+nx, a.y+ny); ctx.lineTo(b.x+nx, b.y+ny);
    ctx.lineTo(b.x-nx, b.y-ny); ctx.lineTo(a.x-nx, a.y-ny);
    ctx.closePath();
    ctx.fillStyle = '#1e2a3a';
    ctx.fill();
  }
  for (const [a, b] of EDGES) drawTaxiwaySegment(a, b, 14);

  // Taxiway centerlines (yellow dashed)
  ctx.setLineDash([8, 6]);
  ctx.strokeStyle = 'rgba(250,204,21,0.45)';
  ctx.lineWidth = 1;
  for (const [a, b] of EDGES) {
    const na = NODES[a], nb = NODES[b];
    if (!na || !nb) continue;
    ctx.beginPath(); ctx.moveTo(na.x, na.y); ctx.lineTo(nb.x, nb.y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Node dots (intersection markers)
  for (const [id, n] of Object.entries(NODES)) {
    const isGate = id.startsWith('g') && !id.startsWith('ga') && !id.startsWith('gb');
    const isRwy  = id.startsWith('r25');
    ctx.beginPath();
    ctx.arc(n.x, n.y, isGate ? 5 : isRwy ? 4 : 3, 0, Math.PI*2);
    ctx.fillStyle = isGate ? '#1d4ed8' : isRwy ? '#ef4444' : '#334155';
    ctx.fill();
    if (isGate) {
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // Gate labels
    if (n.label && isGate) {
      ctx.fillStyle = '#60a5fa';
      ctx.font = 'bold 8px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y - 8);
    }
  }

  // Taxiway letter labels
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'left';
  for (const [id, n] of Object.entries(NODES)) {
    if (n.label && (n.label === 'A' || n.label === 'B' || n.label === 'C')) {
      ctx.fillStyle = '#facc15';
      ctx.fillText(n.label, n.x - 18, n.y + 4);
    }
  }
}

function drawAircraftTrail(ac) {
  if (ac.trail.length < 2) return;
  // Draw trail (red fade)
  for (let i = 1; i < ac.trail.length; i++) {
    const alpha = i / ac.trail.length * 0.85;
    ctx.strokeStyle = `rgba(239,68,68,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ac.trail[i-1].x, ac.trail[i-1].y);
    ctx.lineTo(ac.trail[i].x, ac.trail[i].y);
    ctx.stroke();
  }
}

function drawAircraftRoute(ac) {
  // Draw remaining route (green)
  if (ac.seg >= ac.path.length - 1) return;
  ctx.strokeStyle = 'rgba(34,197,94,0.55)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.moveTo(ac.x, ac.y);
  for (let i = ac.seg + 1; i < ac.path.length; i++) {
    const n = NODES[ac.path[i]];
    ctx.lineTo(n.x, n.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawAircraftIcon(ac) {
  // Airplane SVG-style drawn on canvas
  ctx.save();
  ctx.translate(ac.x, ac.y);
  ctx.rotate((ac.heading + 90) * Math.PI / 180);

  const s = 9; // scale
  ctx.fillStyle = ac.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 0.8;

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -s*1.2);       // nose
  ctx.lineTo(s*0.18, 0);
  ctx.lineTo(s*0.18, s*0.7);
  ctx.lineTo(-s*0.18, s*0.7);
  ctx.lineTo(-s*0.18, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Wings
  ctx.beginPath();
  ctx.moveTo(0, -s*0.1);
  ctx.lineTo(s*1.1, s*0.5);
  ctx.lineTo(s*0.9, s*0.7);
  ctx.lineTo(0, s*0.35);
  ctx.lineTo(-s*0.9, s*0.7);
  ctx.lineTo(-s*1.1, s*0.5);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Tail
  ctx.beginPath();
  ctx.moveTo(0, s*0.6);
  ctx.lineTo(s*0.45, s*1.1);
  ctx.lineTo(-s*0.45, s*1.1);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.restore();

  // Label
  ctx.save();
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'left';

  // Halo
  ctx.strokeStyle = '#0d1321';
  ctx.lineWidth = 3;
  ctx.strokeText(ac.callsign, ac.x + 13, ac.y - 4);
  ctx.strokeText(Math.round(ac.speed * 20) + 'kt', ac.x + 13, ac.y + 6);

  ctx.fillStyle = ac.color;
  ctx.fillText(ac.callsign, ac.x + 13, ac.y - 4);
  ctx.fillStyle = 'rgba(250,204,21,0.7)';
  ctx.fillText(Math.round(ac.speed * 20) + 'kt', ac.x + 13, ac.y + 6);
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────────
//  LOOP
// ─────────────────────────────────────────────────────────────────

function loop() {
  // Update
  aircrafts = aircrafts.filter(ac => !ac.done);
  for (const ac of aircrafts) updateAircraft(ac);

  // Draw
  drawMap();
  for (const ac of aircrafts) drawAircraftRoute(ac);
  for (const ac of aircrafts) drawAircraftTrail(ac);
  for (const ac of aircrafts) drawAircraftIcon(ac);

  // HUD
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(`${aircrafts.length} aircraft active`, W - 12, H - 10);

  requestAnimationFrame(loop);
}

// Auto-spawn a few to show off
spawnRandom(); spawnRandom(); spawnRandom();
loop();
</script>
</body>
</html>
